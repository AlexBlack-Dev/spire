name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies (npm)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck & build
        run: npm run build

  build-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Sync version from tag
        shell: pwsh
        run: node scripts/sync-version.mjs ("$env:GITHUB_REF_NAME" -replace '^v','')

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      SPIRE_KEYSTORE_PASSWORD: ${{ secrets.SPIRE_KEYSTORE_PASSWORD }}
      SPIRE_KEY_ALIAS: ${{ secrets.SPIRE_KEY_ALIAS }}
      SPIRE_KEY_PASSWORD: ${{ secrets.SPIRE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install dependencies (npm)
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Prepare Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPIRE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SPIRE_KEYSTORE_BASE64 is not configured; refusing to sign a release with a public debug key"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spire-release.keystore"
          echo "SPIRE_KEYSTORE_PATH=$RUNNER_TEMP/spire-release.keystore" >> "$GITHUB_ENV"

      - name: Write tauri.properties (versionCode from tag)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#${PATCH:-0}))
          {
            echo "tauri.android.versionCode=$CODE"
            echo "tauri.android.versionName=$TAG"
          } > src-tauri/gen/android/app/tauri.properties

      - name: Verify signing keystore
        run: |
          if [ ! -f "$SPIRE_KEYSTORE_PATH" ]; then
            echo "::error::Android signing keystore is missing"
            exit 1
          fi
          keytool -list -keystore "$SPIRE_KEYSTORE_PATH" \
            -alias "${SPIRE_KEY_ALIAS}" \
            -storepass "${SPIRE_KEYSTORE_PASSWORD}" > /dev/null

      - name: Initialize Tauri Android
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          else
            echo "Android project already initialized, skipping"
          fi

      - name: Setup Gradle permissions
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build Android APK
        run: npx tauri android build --target aarch64
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          SPIRE_KEYSTORE_PASSWORD: ${{ secrets.SPIRE_KEYSTORE_PASSWORD }}
          SPIRE_KEY_ALIAS: ${{ secrets.SPIRE_KEY_ALIAS }}
          SPIRE_KEY_PASSWORD: ${{ secrets.SPIRE_KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Rename APK
        run: |
          apk=$(find artifacts/android -name "*.apk" | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found in android artifacts"
            exit 1
          fi
          cp "$apk" "artifacts/android/spire-${GITHUB_REF_NAME}.apk"
          ls -la artifacts/android/

      - name: Generate download links
        run: |
          {
            echo "DOWNLOADS<<EOF"
            for f in artifacts/windows/*.exe artifacts/windows/*.msi artifacts/android/spire-*.apk; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "- [$name](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name)"
            done
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: |
            ## Spire ${{ github.ref_name }}

            ### Downloads
            ${{ env.DOWNLOADS }}

            ### Features
            - Rich-text editor (Tiptap), tasks, notes, trash
            - Dark/light themes with custom accent colors
            - Locked notes with password and timed unlock
            - File notes, spreadsheet editor, file converter
            - Self-update with digest-verified installer download
            - Russian and English languages
            - Splash screen

            ### Security
            - Release APK is signed with a stable keystore committed to the repository
            - Installer updates are SHA-256 verified before launch
            - Strict Content Security Policy
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.msi
            artifacts/android/spire-*.apk
