name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Sync version from tag
        shell: pwsh
        run: node scripts/sync-version.mjs ("$env:GITHUB_REF_NAME" -replace '^v','')

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973" || true

      - name: Install dependencies (npm)
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Initialize Tauri Android
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          else
            echo "Android project already initialized, skipping"
          fi

      - name: Setup Gradle permissions
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Generate Android signing keystore
        run: |
          if [ ! -f "src-tauri/gen/android/app/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore src-tauri/gen/android/app/debug.keystore \
              -alias "${{ secrets.SPIRE_KEY_ALIAS || 'androiddebugkey' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.SPIRE_KEYSTORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.SPIRE_KEY_PASSWORD || 'android' }}" \
              -dname "CN=Spire, OU=Spire, O=Spire, L=City, ST=State, C=US"
          else
            echo "Stable keystore found in repo, keeping signature"
          fi

      - name: Build Android APK
        run: npx tauri android build --target aarch64
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          SPIRE_KEYSTORE_PASSWORD: ${{ secrets.SPIRE_KEYSTORE_PASSWORD }}
          SPIRE_KEY_ALIAS: ${{ secrets.SPIRE_KEY_ALIAS }}
          SPIRE_KEY_PASSWORD: ${{ secrets.SPIRE_KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: artifacts/android

      - name: Rename APK
        run: |
          find artifacts/android/ -name "*.apk" -exec mv {} artifacts/android/spire.apk \;
          ls -la artifacts/android/

      - name: Generate download links
        run: |
          {
            echo "DOWNLOADS<<EOF"
            for f in artifacts/windows/*.exe artifacts/windows/*.msi artifacts/android/*.apk; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "- [$name](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name)"
            done
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Spire ${{ github.ref_name }}

            ### Downloads
            ${{ env.DOWNLOADS }}

            ### Features
            - Rich-text editor (Tiptap), tasks, notes, trash
            - Dark/light themes with custom accent colors
            - Note locking with password
            - File browser with in-app file saving
            - Russian and English languages
            - Splash screen, back navigation, anti-paste protection
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.msi
            artifacts/android/**/*.apk
